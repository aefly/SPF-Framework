name: CMake Build Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      # We use -A x64 for 64-bit build (SCS games are 64-bit)
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release -A x64

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: spf-framework-${{ github.sha }}
        path: |
          ${{github.workspace}}/build/Release/spf-framework.dll
          ${{github.workspace}}/build/Release/spf-framework.pdb
        if-no-files-found: error
